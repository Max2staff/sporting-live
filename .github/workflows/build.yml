name: aggiorna-e-pubblica

on:
  schedule:
    - cron: "*/30 18-23 * * 1-5"   # serate feriali: 20:00-01:30 (ora legale) / 19:00-00:30 (ora solare)
    - cron: "0 5 * * *"            # mattino: 07:00 (ora legale) / 06:00 (ora solare)
  push:
    branches: [main]
    paths: ["stagioni.json", "alias.json", "scraper/**", "site/**", "!site/data/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Europe/Rome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install -r scraper/requirements.txt
      - run: python -m pytest -q
      - run: npm test
      - name: Leggi il sito ufficiale
        id: fetch
        continue-on-error: true
        run: python -m scraper.fetch
      - name: Costruisci i dati del sito
        run: python -m scraper.build
      - name: Salva cache e dati nel repo
        run: |
          git config user.name sporting-live-bot
          git config user.email sporting-live-bot@users.noreply.github.com
          git add scraper/cache build/raw site/data site/s site/cal
          git diff --cached --quiet || (git commit -m "chore: aggiornamento dati [skip ci]" && git pull --rebase --autostash origin main && git push)
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
      - name: Segnala il fallimento della lettura
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::python -m scraper.fetch è uscito con errore: vedi i log sopra"
          exit 1
