name: aggiorna-e-pubblica

on:
  schedule:
    # orari in UTC (in Italia +1 d'inverno, +2 d'estate); GitHub può partire con qualche minuto di ritardo
    - cron: "0 */2 * * *"           # ogni 2 ore, tutti i giorni: i dati ufficiali escono a orari variabili
    - cron: "*/30 18-23 * * 1-5"   # in più, serate feriali ogni 30 minuti: è quando finiscono le partite
  push:
    branches: [main]
    paths: ["stagioni.json", "alias.json", "scraper/**", "site/**", "!site/data/**", "contenuti/**", "scripts/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Europe/Rome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install -r scraper/requirements.txt
      - run: python -m pytest -q
      - run: npm test
      - name: Leggi il sito ufficiale
        id: fetch
        continue-on-error: true
        run: python -m scraper.fetch
      - name: Ricorda l'indice pubblicato
        run: cp site/data/indice.json /tmp/indice-prima.json || true
      - name: Costruisci i dati del sito
        run: python -m scraper.build
      - name: Salva cache e dati nel repo
        run: |
          git config user.name sporting-live-bot
          git config user.email sporting-live-bot@users.noreply.github.com
          git add scraper/cache build/raw site/data site/s site/cal
          git diff --cached --quiet || (git commit -m "chore: aggiornamento dati [skip ci]" && git pull --rebase --autostash origin main && git push)
      - name: Tieni vivi gli aggiornamenti programmati
        # GitHub spegne le esecuzioni programmate dopo 60 giorni senza modifiche al repo (es. pausa estiva):
        # se l'ultima modifica ha più di 45 giorni, registra una modifica vuota.
        if: github.event_name == 'schedule'
        run: |
          ultima=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultima )) -gt $(( 45 * 86400 )) ]; then
            git commit --allow-empty -m "chore: mantieni attivi gli aggiornamenti [skip ci]"
            git pull --rebase origin main && git push
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
      - name: Avvisi Telegram
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: python scripts/telegram.py /tmp/indice-prima.json site/data/indice.json || true
      - name: Segnala il fallimento della lettura
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::python -m scraper.fetch è uscito con errore: vedi i log sopra"
          exit 1
