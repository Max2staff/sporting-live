name: aggiorna-e-pubblica

on:
  schedule:
    - cron: "*/30 18-23 * * 1-5"   # serate feriali: 20:00-01:30 (ora legale) / 19:00-00:30 (ora solare)
    - cron: "0 5 * * *"            # mattino: 07:00 (ora legale) / 06:00 (ora solare)
  push:
    branches: [main]
    paths: ["stagioni.json", "alias.json", "scraper/**", "site/**", "!site/data/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Europe/Rome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r scraper/requirements.txt
      - run: python -m pytest -q
      - run: npm test
      - name: Leggi il sito ufficiale
        run: python -m scraper.fetch
      - name: Costruisci i dati del sito
        run: python -m scraper.build
      - name: Salva cache e dati nel repo
        run: |
          git config user.name sporting-live-bot
          git config user.email sporting-live-bot@users.noreply.github.com
          git add scraper/cache build/raw site/data
          git diff --cached --quiet || (git commit -m "chore: aggiornamento dati [skip ci]" && git pull --rebase --autostash origin main && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
